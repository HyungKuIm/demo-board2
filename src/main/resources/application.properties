spring.application.name=demo-board

# MySQL (환경변수로 덮어쓸 수 있음: DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# 개발용: 엔티티 기준으로 테이블 자동 생성/변경. 운영에서는 validate 로 바꾸고 db/board.sql 로 스키마 관리
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# JSON fields use the same names as the board columns (board_num, re_ref, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
board.upload-dir=uploads
